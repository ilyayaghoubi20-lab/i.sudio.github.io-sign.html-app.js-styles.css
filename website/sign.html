<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Auth Example</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f4; }
    .auth-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0288d1; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .toggle { text-align: center; margin-top: 10px; cursor: pointer; color: #0288d1; font-size: 0.9em; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Log In UI -->
    <div id="login-form">
      <h2>Log In</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <button id="btn-login">Log In</button>
      <div class="toggle" onclick="toggleForms()">Need an account? Sign Up</div>
    </div>

    <!-- Create Account UI -->
    <div id="signup-form" class="hidden">
      <h2>Create Account</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" required>
      </div>
      <button id="btn-signup">Create Account</button>
      <div class="toggle" onclick="toggleForms()">Have an account? Log In</div>
    </div>
  </div>

  <script>
    // Toggle display between forms
    function toggleForms() {
      document.getElementById('login-form').classList.toggle('hidden');
      document.getElementById('signup-form').classList.toggle('hidden');
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Replace with your project settings from the Firebase Console
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Create Account Handler
    document.getElementById('btn-signup').addEventListener('click', () => {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      createUserWithEmailAndPassword(auth, email, password)
        .then(() => alert("Success! Account created and logged in!"))
        .catch(err => alert(err.message));
    });

    // Log In Handler
    document.getElementById('btn-login').addEventListener('click', () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      signInWithEmailAndPassword(auth, email, password)
        .then(() => alert("Success! Logged in!"))
        .catch(err => alert(err.message));
    });
  </script>
</body>
</html>
